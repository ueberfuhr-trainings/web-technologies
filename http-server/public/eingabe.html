<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rezept erstellen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Rezept erstellen</h1>

<form action="gelbekatze">
  <button type="button" id="myButton">Click me!</button>
  <div class="form-row">
    <label for="nameInput">Name</label>
    <input id="nameInput" name="name" type="text" required minlength="3">
  </div>
  <div id="zutatenInputs">
  </div>
  <div>
    <a id="add-zutaten-link">Zutat hinzufügen</a>
  </div>
  <div class="form-row">
    <label for="zubereitung1">Schritt 1</label>
    <textarea id="zubereitung1"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung2">Schritt 2</label>
    <textarea id="zubereitung2"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung3">Schritt 3</label>
    <textarea id="zubereitung3"></textarea>
  </div>
  <input class="form-row" type="submit">
</form>

<script src="eingabe.js"></script>
<script src="script.js"></script>

</body>
</html>
