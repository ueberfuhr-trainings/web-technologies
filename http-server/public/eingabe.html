<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rezept erstellen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Rezept erstellen</h1>

<form>
  <div class="form-row">
    <label for="nameInput">Name</label>
    <input id="nameInput" name="name" type="text" required minlength="3">
  </div>
  <div class="form-row">
    <label for="zutat1">Zutat 1</label>
    <select class="zutaten-auswahl" name="zutat1">
    </select>
    <input name="menge1" id="zutat1" type="number" min="1">
  </div>
  <div class="form-row">
    <label for="zutat2">Zutat 2</label>
    <select class="zutaten-auswahl">
    </select>
    <input id="zutat2" type="number" min="1">
  </div>
  <div class="form-row">
    <label for="zutat3">Zutat 3</label>
    <select class="zutaten-auswahl">
    </select>
    <input id="zutat3" type="number" min="1">
  </div>
  <div class="form-row">
    <label for="zubereitung1">Schritt 1</label>
    <textarea id="zubereitung1"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung2">Schritt 2</label>
    <textarea id="zubereitung2"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung3">Schritt 3</label>
    <textarea id="zubereitung3"></textarea>
  </div>
  <input class="form-row" type="submit">
</form>

<script>
  let zutaten = [
    {
      name: 'Tomaten',
      unit: 'St.'
    },
    {
      name: 'Wasser',
      unit: 'ml'
    },
    {
      name: 'Sellerie',
      unit: 'g.'
    },
    {
      name: 'Hackfleisch',
      unit: 'g.'
    }
  ];
  document
    .querySelectorAll('.zutaten-auswahl')
    .forEach(combobox => {
      combobox.innerHTML = zutaten
        .map(zutat => `<option>${zutat.name} (${zutat.unit})</option>`)
        .join()
    });
</script>
<script src="script.js"></script>

</body>
</html>
