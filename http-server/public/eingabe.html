<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rezept erstellen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Rezept erstellen</h1>

<form action="gelbekatze">
  <button type="button" id="myButton">Click me!</button>
  <div class="form-row">
    <label for="nameInput">Name</label>
    <input id="nameInput" name="name" type="text" required minlength="3">
  </div>
  <div id="zutatenInputs">
  </div>
  <div>
    <a id="add-zutaten-link">Zutat hinzufügen</a>
  </div>
  <div class="form-row">
    <label for="zubereitung1">Schritt 1</label>
    <textarea id="zubereitung1"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung2">Schritt 2</label>
    <textarea id="zubereitung2"></textarea>
  </div>
  <div class="form-row">
    <label for="zubereitung3">Schritt 3</label>
    <textarea id="zubereitung3"></textarea>
  </div>
  <input class="form-row" type="submit">
</form>

<script>
  let zutaten = [
    {
      name: 'Tomaten',
      unit: 'St.'
    },
    {
      name: 'Wasser',
      unit: 'ml'
    },
    {
      name: 'Sellerie',
      unit: 'g.'
    },
    {
      name: 'Hackfleisch',
      unit: 'g.'
    }
  ];

  function displayZutaten() {
    document
      .querySelectorAll('.zutaten-auswahl')
      .forEach(combobox => {
        combobox.innerHTML = zutaten
          .map(zutat => `<option>${zutat.name} (${zutat.unit})</option>`)
          .join()
      });
  }

  displayZutaten();

  document
    .querySelector('#myButton')
    .addEventListener('click', () => {
      zutaten.push({
        name: 'XYZ',
        unit: 'KG.'
      });
      displayZutaten();
    });

  let zutatenCounter = 1;

  function addZutatenInput() {
    document
      .querySelector('#zutatenInputs')
      .insertAdjacentHTML('beforeend', `
        <div class="form-row">
            <label for="zutat${zutatenCounter}">Zutat #${zutatenCounter}</label>
            <select class="zutaten-auswahl" name="zutat${zutatenCounter}">
            </select>
            <input name="menge1" id="zutat${zutatenCounter}" type="number" min="1">
        </div>
      `);
    zutatenCounter++;
    displayZutaten(); // TODO: nur die neue SELECT befüllen, nicht ALLE
  }

  document
    .querySelector('#add-zutaten-link')
    .addEventListener('click', () => {
      addZutatenInput();
    });
  addZutatenInput();
</script>
<script src="script.js"></script>

</body>
</html>
